[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamguard"
version = "0.2.0a1"
description = "Windows local livestream profanity censor MVP"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "sounddevice>=0.5,<0.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
app = ["vosk>=0.3.45,<0.4", "PySide6>=6.7,<7"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
streamguard = "streamguard.cli:main"
streamguard-gui = "streamguard.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
